<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hospital Management System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-hospital-user"></i>
            <span>MediCare HMS</span>
        </div>
        <form class="search-form" action="{{ url_for('search') }}" method="GET">
            <input type="text" name="q" placeholder="Search patients by name or phone..." required>
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        <ul class="nav-links">
            <li><a href="{{ url_for('dashboard') }}"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="{{ url_for('patients') }}"><i class="fa-solid fa-user-injured"></i> Patients</a></li>
            <li><a href="{{ url_for('doctors') }}"><i class="fa-solid fa-user-md"></i> Doctors</a></li>
            <li><a href="{{ url_for('appointments') }}"><i class="fa-solid fa-calendar-check"></i> Appointments</a></li>
            <li><a href="{{ url_for('billing') }}"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
